<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Recupera el trabajo antes de generar más.</title><desc>Cola conceptual · Revisión y presupuesto antes de cada acción de pago Registra acciones en curso e inciertas. Una celda vacía no demuestra que nunca se haya iniciado el trabajo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Recupera el trabajo antes de generar más.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Cola conceptual · Revisión y presupuesto antes de cada acción de pago</text><rect x="48" y="190" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="226" fill="#ecebe7" font-size="22" font-weight="650">Reservar SKU + versión</text><text x="68" y="258" fill="#a8adb8" font-size="17">Un trabajador por registro</text><rect x="470" y="190" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="226" fill="#ecebe7" font-size="22" font-weight="650">¿Existe un render ID?</text><text x="490" y="258" fill="#a8adb8" font-size="17">Consultar antes de crear</text><rect x="890" y="190" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="226" fill="#ecebe7" font-size="22" font-weight="650">Reanudar trabajo</text><text x="910" y="258" fill="#a8adb8" font-size="17">Sin generar un sustituto</text><path d="M383 240 L470 240" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 240 L890 240" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><text x="847.5" y="228.0" text-anchor="middle" fill="#a8adb8" font-size="16">Sí</text><rect x="470" y="430" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="466" fill="#ecebe7" font-size="22" font-weight="650">Crear / conciliar</text><text x="490" y="498" fill="#a8adb8" font-size="17">Clave estable del preview</text><path d="M640 290 L640 430" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><text x="640.0" y="348.0" text-anchor="middle" fill="#a8adb8" font-size="16">No</text><rect x="890" y="430" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="466" fill="#ecebe7" font-size="22" font-weight="650">Entregar + registrar</text><text x="910" y="498" fill="#a8adb8" font-size="17">Guardar ID del medio final</text><path d="M1060 290 L1060 430" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 480 L890 480" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">Registra acciones en curso e inciertas. Una celda vacía no demuestra que nunca se haya iniciado el trabajo.</text></g></svg>
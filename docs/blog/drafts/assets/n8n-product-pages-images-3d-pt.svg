<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Um produto e os ficheiros para revisão.</title><desc>Esquema do fluxo da ficha de produto A série de imagens e a criação do modelo 3D são pagas. Aprove cada operação separadamente.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Um produto e os ficheiros para revisão.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Esquema do fluxo da ficha de produto</text><rect x="48" y="290" width="265" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="326" fill="#ecebe7" font-size="22" font-weight="650">Catálogo verificado</text><text x="68" y="358" fill="#a8adb8" font-size="17">SKU + foto + dados</text><rect x="390" y="180" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="410" y="216" fill="#ecebe7" font-size="22" font-weight="650">Rascunho do texto</text><text x="410" y="248" fill="#a8adb8" font-size="17">Dados → texto → revisão</text><rect x="390" y="400" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="410" y="436" fill="#ecebe7" font-size="22" font-weight="650">Imagens aprovadas</text><text x="410" y="468" fill="#a8adb8" font-size="17">Vistas → revisão → 3D</text><rect x="840" y="290" width="390" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="860" y="326" fill="#ecebe7" font-size="22" font-weight="650">Ficha em rascunho</text><text x="860" y="358" fill="#a8adb8" font-size="17">SKU + versão da origem</text><path d="M313 315 L390 230" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M313 365 L390 450" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 230 L840 315" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 450 L840 365" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="470" fill="#ecebe7" font-size="21" text-anchor="middle">Aprovação para publicar</text><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">A série de imagens e a criação do modelo 3D são pagas. Aprove cada operação separadamente.</text></g></svg>
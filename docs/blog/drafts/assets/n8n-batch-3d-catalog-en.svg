<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Recover work before generating more.</title><desc>Conceptual queue · Review and budget gates apply before paid work Track in-flight and uncertain actions. A blank result cell is not proof that a job has never started.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Recover work before generating more.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Conceptual queue · Review and budget gates apply before paid work</text><rect x="48" y="190" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="226" fill="#ecebe7" font-size="22" font-weight="650">Claim SKU + version</text><text x="68" y="258" fill="#a8adb8" font-size="17">One worker owns the record</text><rect x="470" y="190" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="226" fill="#ecebe7" font-size="22" font-weight="650">Existing render ID?</text><text x="490" y="258" fill="#a8adb8" font-size="17">Read before creating work</text><rect x="890" y="190" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="226" fill="#ecebe7" font-size="22" font-weight="650">Resume saved job</text><text x="910" y="258" fill="#a8adb8" font-size="17">No replacement generation</text><path d="M383 240 L470 240" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 240 L890 240" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><text x="847.5" y="228.0" text-anchor="middle" fill="#a8adb8" font-size="16">Yes</text><rect x="470" y="430" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="466" fill="#ecebe7" font-size="22" font-weight="650">Create / reconcile</text><text x="490" y="498" fill="#a8adb8" font-size="17">Stable preview creation key</text><path d="M640 290 L640 430" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><text x="640.0" y="348.0" text-anchor="middle" fill="#a8adb8" font-size="16">No</text><rect x="890" y="430" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="466" fill="#ecebe7" font-size="22" font-weight="650">Deliver + record</text><text x="910" y="498" fill="#a8adb8" font-size="17">Save destination media ID</text><path d="M1060 290 L1060 430" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 480 L890 480" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">Track in-flight and uncertain actions. A blank result cell is not proof that a job has never started.</text></g></svg>
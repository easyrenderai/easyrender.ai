<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Conserva el mismo ID durante todo el flujo.</title><desc>Flujo conceptual · Un timeout no crea otro trabajo Solo una acción aprobada entra en la rama de pago. El plazo detiene la consulta, no el trabajo remoto.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Conserva el mismo ID durante todo el flujo.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Flujo conceptual · Un timeout no crea otro trabajo</text><rect x="48" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="236" fill="#ecebe7" font-size="22" font-weight="650">Crear preview</text><text x="68" y="268" fill="#a8adb8" font-size="17">POST una vez; guardar ID</text><rect x="450" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="470" y="236" fill="#ecebe7" font-size="22" font-weight="650">Consultar estado</text><text x="470" y="268" fill="#a8adb8" font-size="17">GET del trabajo guardado</text><rect x="855" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="875" y="236" fill="#ecebe7" font-size="22" font-weight="650">Revisar resultado</text><text x="875" y="268" fill="#a8adb8" font-size="17">Comprobar qué está disponible</text><path d="M423 250 L450 250" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 250 L855 250" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="460" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="470" y="496" fill="#ecebe7" font-size="22" font-weight="650">Esperar y consultar</text><text x="470" y="528" fill="#a8adb8" font-size="17">Bucle limitado + plazo</text><path d="M640 300 L640 460" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 510 L380 510 L380 350 L520 350 L520 300" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="855" y="460" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="875" y="496" fill="#ecebe7" font-size="22" font-weight="650">Autorizar → construir</text><text x="875" y="528" fill="#a8adb8" font-size="17">Después: ready + hasModel</text><path d="M1040 300 L1040 460" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">Solo una acción aprobada entra en la rama de pago. El plazo detiene la consulta, no el trabajo remoto.</text></g></svg>
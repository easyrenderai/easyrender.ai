<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Lo stesso ID per tutto il flusso.</title><desc>Schema delle richieste e della verifica Allo scadere del tempo si fermano le richieste. L’elaborazione può proseguire.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Lo stesso ID per tutto il flusso.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Schema delle richieste e della verifica</text><rect x="48" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="236" fill="#ecebe7" font-size="22" font-weight="650">Crea l’anteprima</text><text x="68" y="268" fill="#a8adb8" font-size="17">Un POST e salva l’ID</text><rect x="450" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="470" y="236" fill="#ecebe7" font-size="22" font-weight="650">Leggi lo stato</text><text x="470" y="268" fill="#a8adb8" font-size="17">GET con l’ID salvato</text><rect x="855" y="200" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="875" y="236" fill="#ecebe7" font-size="22" font-weight="650">Verifica le viste</text><text x="875" y="268" fill="#a8adb8" font-size="17">Controlla i file</text><path d="M423 250 L450 250" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 250 L855 250" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="460" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="470" y="496" fill="#ecebe7" font-size="22" font-weight="650">Attendi e interroga</text><text x="470" y="528" fill="#a8adb8" font-size="17">Ciclo con scadenza</text><path d="M640 300 L640 460" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 510 L380 510 L380 350 L520 350 L520 300" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="855" y="460" width="375" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="875" y="496" fill="#ecebe7" font-size="22" font-weight="650">Autorizza → genera</text><text x="875" y="528" fill="#a8adb8" font-size="17">Poi GET: ready + hasModel</text><path d="M1040 300 L1040 460" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">Allo scadere del tempo si fermano le richieste. L’elaborazione può proseguire.</text></g></svg>
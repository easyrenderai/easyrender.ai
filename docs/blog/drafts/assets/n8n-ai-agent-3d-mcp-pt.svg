<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Limite o acesso às ferramentas.</title><desc>Esquema com aprovação fora do prompt O agente da pré-visualização não pode originar custos nem publicar ficheiros.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Limite o acesso às ferramentas.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Esquema com aprovação fora do prompt</text><rect x="48" y="230" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="266" fill="#ecebe7" font-size="22" font-weight="650">Agente de pré-visualização</text><text x="68" y="298" fill="#a8adb8" font-size="17">Acesso: read + write</text><rect x="470" y="230" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="266" fill="#ecebe7" font-size="22" font-weight="650">Aprovação humana</text><text x="490" y="298" fill="#a8adb8" font-size="17">Tarefa + ação + limite</text><rect x="890" y="230" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="266" fill="#ecebe7" font-size="22" font-weight="650">Fluxo pago</text><text x="910" y="298" fill="#a8adb8" font-size="17">Credencial separada</text><path d="M383 280 L470 280" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 280 L890 280" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="440" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="476" fill="#ecebe7" font-size="22" font-weight="650">Ferramentas autorizadas</text><text x="68" y="508" fill="#a8adb8" font-size="17">create_render · get_render</text><rect x="470" y="440" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="476" fill="#ecebe7" font-size="22" font-weight="650">Recusado ou expirado</text><text x="490" y="508" fill="#a8adb8" font-size="17">Pare e guarde a tarefa.</text><rect x="890" y="440" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="476" fill="#ecebe7" font-size="22" font-weight="650">Ficheiro pronto</text><text x="910" y="508" fill="#a8adb8" font-size="17">Transferência autenticada</text><path d="M215 330 L215 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 330 L640 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1060 330 L1060 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">O agente da pré-visualização não pode originar custos nem publicar ficheiros.</text></g></svg>
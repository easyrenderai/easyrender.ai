<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Limitez l’accès aux outils.</title><desc>Schéma avec validation hors du prompt L’agent qui crée l’aperçu n’engage aucune dépense et ne publie aucun fichier.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b1b9c7" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="24" fill="#101114"/><g font-family="Arial, sans-serif"><text x="48" y="66" fill="#ecebe7" font-size="32" font-weight="650">Limitez l’accès aux outils.</text><text x="48" y="105" fill="#a8adb8" font-size="20">Schéma avec validation hors du prompt</text><rect x="48" y="230" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="266" fill="#ecebe7" font-size="22" font-weight="650">Agent d’aperçu</text><text x="68" y="298" fill="#a8adb8" font-size="17">Accès : read + write</text><rect x="470" y="230" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="266" fill="#ecebe7" font-size="22" font-weight="650">Validation humaine</text><text x="490" y="298" fill="#a8adb8" font-size="17">Tâche + action + plafond</text><rect x="890" y="230" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="266" fill="#ecebe7" font-size="22" font-weight="650">Génération payante</text><text x="910" y="298" fill="#a8adb8" font-size="17">Accès distinct</text><path d="M383 280 L470 280" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 280 L890 280" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="440" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="68" y="476" fill="#ecebe7" font-size="22" font-weight="650">Outils autorisés</text><text x="68" y="508" fill="#a8adb8" font-size="17">create_render · get_render</text><rect x="470" y="440" width="335" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="490" y="476" fill="#ecebe7" font-size="22" font-weight="650">Refus ou expiration</text><text x="490" y="508" fill="#a8adb8" font-size="17">Arrêt. Conserver la tâche.</text><rect x="890" y="440" width="340" height="100" rx="16" fill="#191b20" stroke="#454953"/><text x="910" y="476" fill="#ecebe7" font-size="22" font-weight="650">Fichier prêt</text><text x="910" y="508" fill="#a8adb8" font-size="17">Téléchargement authentifié</text><path d="M215 330 L215 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 330 L640 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1060 330 L1060 440" fill="none" stroke="#b1b9c7" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="643" x2="1232" y2="643" stroke="#343841"/><text x="48" y="681" fill="#a8adb8" font-size="17">L’agent qui crée l’aperçu n’engage aucune dépense et ne publie aucun fichier.</text></g></svg>
name: 3D model bake-off
run-name: "3D model bake-off · ${{ inputs.candidates }}"

# Manual only. Builds the showcase photos with each candidate image-to-3D model on Replicate. It
# spends real money (TRELLIS.2 is about $0.73 a run, Hunyuan 3.1 about $0.50), so it needs the word
# "spend" typed in. Needs the repository secret REPLICATE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this spends Replicate credit'
        required: true
        type: string
      candidates:
        description: "Comma-separated ids: trellis1, hunyuan31, trellis2"
        required: true
        default: "trellis1,hunyuan31,trellis2"
        type: string
      photos:
        description: "Comma-separated showcase photos (armchair, bedside-table, clay-vase, coffee-table, swivel-chair, vase)"
        required: true
        default: "armchair,swivel-chair,coffee-table"
        type: string

permissions:
  contents: read

jobs:
  bakeoff:
    name: Bake-off
    if: ${{ inputs.confirm == 'spend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the bake-off
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CANDIDATES: ${{ inputs.candidates }}
          PHOTOS: ${{ inputs.photos }}
        run: bun packages/harness/scripts/model3d-bakeoff.ts --spend --candidates="$CANDIDATES" --photos="$PHOTOS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3d-bakeoff
          path: model3d-out
          if-no-files-found: ignore

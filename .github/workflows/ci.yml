name: CI
run-name: "CI · ${{ github.event.pull_request.title }}"

# Merging to main deploys nothing: production ships through release.yml. This workflow only checks
# (pull requests, and once more on the pinned commit when a release runs); it never deploys.
# "CI Gate" is the one required check: it fails if any job fails.
# The "Schema change" job runs the same additive-only check the production build runs, so a risky
# schema change fails here instead of stopping the deploy after the merge.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by release.yml, which re-verifies the exact commit it is about to ship.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easyrender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service database: billing/concurrency tests must run, not silently skip.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easyrender_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easyrender_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the effect baseline can be compared with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check . --error-on-warnings
      - name: UI guards
        run: bun run check:ui-guards
      - name: Secrets
        run: bun run check:secrets
      - name: useEffect ratchet
        run: |
          bun test scripts/use-effect-audit.test.ts
          bun run check:use-effects
      - name: useEffect baseline may not grow
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run check:use-effects --against "origin/$BASE_REF"
      - name: Unused code and env variables
        run: |
          bun test scripts/name-ratchet.test.ts
          bun run check:knip
          bun run check:env
      - name: Unused code and env baselines may not grow
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bun run check:knip --against "origin/$BASE_REF"
          bun run check:env --against "origin/$BASE_REF"
      - name: Docs match the repo
        run: bun run check:docs
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: |
          bun run --cwd packages/db db:push
          bun run test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Release promotion and production smoke contracts
        run: node --test scripts/promote-vercel.test.mjs scripts/prod-smoke.test.mjs
      - name: Python and TypeScript API examples
        run: |
          bunx tsc -p examples/rest/tsconfig.json
          python3 examples/rest/test_smoke.py

  schema:
    name: Schema change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easyrender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easyrender
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply the schema on main to an empty database
        working-directory: packages/db
        run: |
          git show "origin/${{ github.base_ref || 'main' }}:packages/db/prisma/schema.prisma" > "$RUNNER_TEMP/main.prisma"
          bun run prisma db push --schema "$RUNNER_TEMP/main.prisma"
      - name: Check that this branch's schema change is additive
        run: bun run --cwd packages/db db:check

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  plugins:
    name: Store plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP syntax (WooCommerce plugin)
        run: find plugins/woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WooCommerce plugin tests
        run: php plugins/woocommerce/easyrender-3d/tests/run.php
      - name: PHP syntax (PrestaShop module)
        run: find plugins/prestashop -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PrestaShop module tests
        run: php plugins/prestashop/easyrender3d/tests/run.php

  # The paid journey in a real browser: upload, preview, sign up, buy, build, download. Replicate is
  # a local mock and checkout is the dev checkout, so nothing is charged. Not in the CI Gate yet:
  # it is a new, slow job. Move it into the Gate `needs` once it has been green for a week.
  e2e:
    name: Paid flow (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easyrender_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easyrender_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Create the schema
        run: bun run --cwd packages/db db:push
      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Paid flow and browser specs
        run: bun run --cwd apps/web e2e
      - name: Keep screenshots and the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: .data/e2e
          retention-days: 7

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [checks, schema, mobile, plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.schema.result }}" != "success" ] || [ "${{ needs.mobile.result }}" != "success" ] || [ "${{ needs.plugins.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}, schema: ${{ needs.schema.result }}, mobile: ${{ needs.mobile.result }}, plugins: ${{ needs.plugins.result }}"
            exit 1
          fi

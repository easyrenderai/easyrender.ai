name: Material fidelity bake-off
run-name: "Material fidelity · public hero table · ${{ inputs.confirm }}"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Use dry-run, or type spend after approving three provider builds"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - spend
      cap:
        description: "Estimated spend reservation in USD (not a provider billing limit)"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare the same table
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the approved comparison or write its dry-run plan
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CAP: ${{ inputs.cap }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          args=(--cap="$CAP" --out=material-fidelity-out)
          if [ "$CONFIRM" = spend ]; then args+=(--spend); fi
          bun packages/harness/scripts/material-fidelity-bakeoff.ts "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-fidelity
          path: material-fidelity-out
          if-no-files-found: ignore

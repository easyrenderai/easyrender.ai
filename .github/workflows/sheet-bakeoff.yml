name: Sheet bake-off
run-name: "Sheet bake-off · ${{ inputs.candidates }}"

# Manual only. Draws the angle sheet of the showcase photos with each candidate model on Replicate,
# runs the production guardrails on it and optionally builds the 3D model. It spends real money
# (about $3 to $6 for the full set with builds), so it needs the word "spend" typed in.
# Needs the repository secret REPLICATE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this spends Replicate credit'
        required: true
        type: string
      kind:
        description: "sheets: the angle sheet models. models3d: the image-to-3D models (trellis1, hunyuan31, trellis2; about $0.50 to $0.73 a run for the last two)"
        required: true
        default: sheets
        type: choice
        options:
          - sheets
          - models3d
      candidates:
        description: "Comma-separated ids (sheets: pro-2k, nb2-2k, nb2-1k, nb21-2k, nb21-1k, lite-1k, gpt26-flare, gpt26-sunburst, gpt-low, gpt-medium, gpt-high; models3d: trellis1, hunyuan31, trellis2, t2-low, t2-mid, t2-high)"
        required: true
        default: "pro-2k,nb2-2k,nb2-1k,lite-1k,gpt-low,gpt-medium,gpt-high"
        type: string
      photos:
        description: "Comma-separated showcase photos (armchair, bedside-table, clay-vase, coffee-table, swivel-chair, vase)"
        required: true
        default: "armchair,bedside-table,clay-vase,coffee-table,swivel-chair,vase"
        type: string
      build:
        description: "Also build the 3D model from each sheet with TRELLIS"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  bakeoff:
    name: Bake-off
    if: ${{ inputs.confirm == 'spend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the bake-off
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          KIND: ${{ inputs.kind }}
          CANDIDATES: ${{ inputs.candidates }}
          PHOTOS: ${{ inputs.photos }}
          BUILD: ${{ inputs.build }}
        run: |
          flags="--spend --candidates=$CANDIDATES --photos=$PHOTOS"
          if [ "$KIND" = "models3d" ]; then
            bun packages/harness/scripts/model3d-bakeoff.ts $flags
          else
            if [ "$BUILD" = "true" ]; then flags="$flags --build"; fi
            bun packages/harness/scripts/sheet-bakeoff.ts $flags
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet-bakeoff
          path: |
            bakeoff-out
            model3d-out
          if-no-files-found: ignore
